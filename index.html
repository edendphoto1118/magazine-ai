<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Magazine Cover | Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <style>
        /* 雜誌感字體定義 */
        .font-magazine-main { font-family: 'Bodoni Moda', serif; }
        .font-magazine-sub { font-family: 'Cinzel', serif; }
        .font-ui { font-family: 'Inter', sans-serif; }

        /* 隱藏滾動條但保留功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 玻璃擬態 (Glassmorphism) */
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        /* 載入動畫 */
        .loader {
            width: 20px; height: 20px;
            border: 2px solid #000;
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-[#F2F2F2] text-gray-900 font-ui h-screen overflow-hidden flex flex-col items-center justify-center">

    <div id="app" class="relative w-full h-full flex flex-col items-center">

        <nav class="fixed top-0 z-50 w-full px-6 py-4 flex justify-between items-center bg-transparent pointer-events-none">
            <div class="pointer-events-auto bg-black text-white px-4 py-1.5 rounded-full text-xs font-bold tracking-widest shadow-lg">
                MAGAZINE.AI
            </div>
            
            <button @click="download" :disabled="!imageLoaded" 
                class="pointer-events-auto flex items-center gap-2 bg-black text-white px-5 py-2 rounded-full font-medium text-sm shadow-xl hover:bg-gray-800 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                <i data-lucide="download" class="w-4 h-4"></i> 匯出封面
            </button>
        </nav>

        <main class="flex-1 w-full flex items-center justify-center p-4 relative">
            
            <div v-if="!imageLoaded" class="text-center space-y-4 animate-fade-in">
                <div class="w-24 h-24 bg-gray-200 rounded-full flex items-center justify-center mx-auto mb-4 border-2 border-dashed border-gray-400">
                    <i data-lucide="image-plus" class="w-8 h-8 text-gray-400"></i>
                </div>
                <h2 class="text-xl font-bold text-gray-700">建立你的第一本雜誌封面</h2>
                <p class="text-gray-500 text-sm">支援智慧去背與景深效果</p>
                <label class="cursor-pointer inline-flex items-center gap-2 bg-black text-white px-6 py-3 rounded-full hover:scale-105 transition-transform shadow-lg mt-4">
                    <span>選擇照片</span>
                    <input type="file" @change="handleUpload" accept="image/*" class="hidden">
                </label>
            </div>

            <div v-show="imageLoaded" class="relative shadow-2xl transition-all duration-300 ease-in-out transform"
                 :class="{'scale-95': isMenuOpen, 'scale-100': !isMenuOpen}"
                 style="aspect-ratio: 3/4; height: 80vh; max-height: 800px; background: white;"
                 ref="canvasRef">
                
                <img :src="originalImage" class="absolute inset-0 w-full h-full object-cover z-0" crossorigin="anonymous">

                <div class="absolute inset-0 z-10 flex flex-col justify-between p-8 pointer-events-none">
                    
                    <div class="flex flex-col items-center pt-4">
                        <div class="w-full flex justify-between text-[10px] tracking-[0.3em] font-bold border-b border-white/40 pb-2 mb-2" :style="{ color: textColor }">
                            <span>VOL.26</span>
                            <span>{{ currentDate }}</span>
                        </div>
                        
                        <h1 class="font-magazine-main text-[13vh] leading-[0.8] tracking-tighter text-center mix-blend-overlay opacity-90 transition-colors duration-300"
                            :style="{ color: mainColor }">
                            {{ title }}
                        </h1>
                        
                        <h2 class="mt-4 text-sm md:text-lg tracking-[0.4em] font-magazine-sub text-center backdrop-blur-md bg-white/10 px-6 py-1 rounded-sm transition-colors duration-300"
                            :style="{ color: textColor }">
                            {{ subtitle }}
                        </h2>
                    </div>

                    <div class="flex justify-between items-end opacity-80" :style="{ color: textColor }">
                        <div class="text-[10px] space-y-1">
                            <p class="font-bold">EXCLUSIVE</p>
                            <p class="w-24 leading-tight opacity-70">Architecture & Design Monthly Issue.</p>
                        </div>
                        <div class="h-8 w-24 bg-current" style="mask: repeating-linear-gradient(90deg, black, black 2px, transparent 2px, transparent 4px); -webkit-mask: repeating-linear-gradient(90deg, black, black 2px, transparent 2px, transparent 4px);"></div>
                    </div>
                </div>

                <img v-if="depthEffect && cutoutImage" :src="cutoutImage" class="absolute inset-0 w-full h-full object-cover z-20 pointer-events-none" crossorigin="anonymous">
                
                <div class="absolute inset-0 z-30 pointer-events-none opacity-10 bg-[url('https://grainy-gradients.vercel.app/noise.svg')]"></div>

            </div>
        </main>

        <div v-if="imageLoaded" class="fixed bottom-6 z-40 w-full max-w-md px-4">
            <div class="glass rounded-2xl p-4 shadow-2xl flex flex-col gap-4 animate-slide-up">
                
                <div class="grid grid-cols-2 gap-3">
                    <input v-model="title" type="text" class="bg-gray-50/50 border-0 rounded-lg px-3 py-2 text-sm font-bold focus:ring-2 focus:ring-black outline-none" placeholder="主標題">
                    <input v-model="subtitle" type="text" class="bg-gray-50/50 border-0 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-black outline-none" placeholder="副標題">
                </div>

                <div class="flex items-center justify-between gap-4">
                    
                    <div class="flex items-center gap-2">
                        <div class="relative w-8 h-8 rounded-full overflow-hidden border border-gray-200 shadow-sm cursor-pointer hover:scale-110 transition-transform">
                            <input v-model="mainColor" type="color" class="absolute -top-2 -left-2 w-12 h-12 cursor-pointer p-0 border-0">
                        </div>
                        <div class="relative w-8 h-8 rounded-full overflow-hidden border border-gray-200 shadow-sm cursor-pointer hover:scale-110 transition-transform">
                            <input v-model="textColor" type="color" class="absolute -top-2 -left-2 w-12 h-12 cursor-pointer p-0 border-0">
                        </div>
                    </div>

                    <button @click="toggleDepth" 
                        class="flex-1 flex items-center justify-center gap-2 py-2 rounded-lg text-sm font-medium transition-all"
                        :class="depthEffect ? 'bg-black text-white' : 'bg-gray-100 text-gray-500'">
                        <span v-if="processing" class="loader border-gray-400 border-t-transparent w-4 h-4"></span>
                        <span v-else>{{ depthEffect ? '✨ 景深開啟' : '景深關閉' }}</span>
                    </button>

                    <label class="p-2 rounded-lg bg-gray-100 hover:bg-gray-200 cursor-pointer transition-colors">
                        <i data-lucide="image-plus" class="w-5 h-5 text-gray-600"></i>
                        <input type="file" @change="handleUpload" accept="image/*" class="hidden">
                    </label>
                </div>
            </div>
        </div>

        <div v-if="statusMsg" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-black/80 text-white px-4 py-2 rounded-full text-xs backdrop-blur-md z-50 transition-opacity">
            {{ statusMsg }}
        </div>

    </div>

    <script type="module">
        import imglyRemoveBackground from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.3.0/+esm";

        const { createApp, ref, computed, nextTick, onMounted } = Vue;

        createApp({
            setup() {
                // 資料狀態
                const title = ref('VOGUE');
                const subtitle = ref('ARCHITECTURAL DIGEST');
                const mainColor = ref('#ffffff');
                const textColor = ref('#ffffff');
                const originalImage = ref(null);
                const cutoutImage = ref(null);
                const imageLoaded = ref(false);
                const depthEffect = ref(false); // 預設關閉，讓使用者自己開，體驗會比較順
                const processing = ref(false);
                const statusMsg = ref('');
                const canvasRef = ref(null);

                // 計算當前日期
                const currentDate = computed(() => {
                    const date = new Date();
                    return `${date.toLocaleString('default', { month: 'short' }).toUpperCase()} ${date.getFullYear()}`;
                });

                // 工具：顯示狀態訊息
                const showStatus = (msg, duration = 3000) => {
                    statusMsg.value = msg;
                    if (duration) setTimeout(() => statusMsg.value = '', duration);
                };

                // 處理上傳
                const handleUpload = async (event) => {
                    const file = event.target.files[0];
                    if (!file) return;

                    // 重置狀態
                    originalImage.value = URL.createObjectURL(file);
                    cutoutImage.value = null;
                    imageLoaded.value = true;
                    depthEffect.value = false; // 上傳新圖時先關閉景深
                    
                    showStatus('圖片載入成功，點擊「景深」按鈕可啟動 AI');
                };

                // 切換景深 (觸發 AI)
                const toggleDepth = async () => {
                    // 如果已經有去背圖，單純開關顯示
                    if (cutoutImage.value) {
                        depthEffect.value = !depthEffect.value;
                        return;
                    }

                    // 如果要開啟但沒有圖，開始運算
                    if (!depthEffect.value && !cutoutImage.value) {
                        processing.value = true;
                        showStatus('AI 正在分析圖片結構 (首次需下載模型約 10秒)...', 0);

                        try {
                            const config = {
                                publicPath: 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.3.0/dist/',
                                debug: false,
                                progress: (key, current, total) => {
                                    // 可以在這裡做進度條
                                }
                            };
                            
                            // 執行去背
                            const blob = await imglyRemoveBackground(originalImage.value, config);
                            cutoutImage.value = URL.createObjectURL(blob);
                            depthEffect.value = true;
                            showStatus('AI 處理完成！文字已置於後方');
                        } catch (error) {
                            console.error(error);
                            showStatus('AI 處理失敗 (可能是網路或圖片格式問題)，已切換回普通模式');
                            depthEffect.value = false;
                        } finally {
                            processing.value = false;
                        }
                    }
                };

                // 下載圖片
                const download = async () => {
                    if (!canvasRef.value) return;
                    showStatus('正在生成高解析度圖片...', 0);
                    
                    // 等待 UI 渲染完成
                    await nextTick();

                    try {
                        const canvas = await html2canvas(canvasRef.value, {
                            scale: 2.5, // 2.5倍解析度
                            useCORS: true, // 關鍵：允許跨域
                            allowTaint: true,
                            backgroundColor: null,
                            logging: false
                        });
                        
                        const link = document.createElement('a');
                        link.download = `cover-${Date.now()}.png`;
                        link.href = canvas.toDataURL('image/png', 1.0);
                        link.click();
                        showStatus('下載完成！');
                    } catch (err) {
                        console.error(err);
                        showStatus('下載失敗，請截圖保存');
                    }
                };

                // 初始化圖標
                onMounted(() => {
                    lucide.createIcons();
                });

                return {
                    title, subtitle, mainColor, textColor,
                    originalImage, cutoutImage, imageLoaded,
                    depthEffect, processing, statusMsg,
                    currentDate, canvasRef,
                    handleUpload, toggleDepth, download
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
